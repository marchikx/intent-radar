[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-radar"
version = "0.1.0"
description = "Offline ATS job parsing, rule gates, scoring, and evidence passports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Portfolio Maintainer" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["intent_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
